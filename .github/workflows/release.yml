name: Release

# Pushing a tag such as v1.2.3 builds a universal Glint.app, publishes the GitHub release and,
# when the TAP_GITHUB_TOKEN secret exists, updates the Homebrew cask.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  SWIFTW_BUILD_SYSTEM: native

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Resolve the version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          version_re='^[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.-]+)?$'
          if [[ ! $version =~ $version_re ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a version tag such as v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$version" != "$file_version" ]]; then
            echo "::warning title=Version mismatch::Tag $GITHUB_REF_NAME does not match the VERSION file ($file_version). Releasing $version."
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: Scripts/package_release.sh --version "$VERSION" --require-universal --build-number "$GITHUB_RUN_NUMBER"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          assets=(
            "dist/Glint-$VERSION.zip"
            "dist/Glint-$VERSION.zip.sha256"
            "dist/Glint-$VERSION.dmg"
            "dist/Glint-$VERSION.dmg.sha256"
          )
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; replacing its assets."
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            exit 0
          fi
          flags=()
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "Glint $VERSION" \
            --generate-notes \
            --notes "$(sed "s/@VERSION@/$VERSION/g" .github/release-notes-header.md)" \
            ${flags[@]+"${flags[@]}"}

      - name: Check for a Homebrew tap token
        id: tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [[ -n "$TAP_GITHUB_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Homebrew tap not updated::Add a TAP_GITHUB_TOKEN secret (a token that can push to the tap repository) to update the cask automatically."
          fi

      - name: Update the Homebrew tap
        if: steps.tap.outputs.enabled == 'true' && steps.version.outputs.prerelease != 'true'
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: Scripts/update_tap.sh --version "$VERSION" --zip "dist/Glint-$VERSION.zip"
