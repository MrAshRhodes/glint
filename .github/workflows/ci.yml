name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Test the product site
        run: node --test .github/scripts/site.test.cjs

      - name: Test release failure gates
        run: node --test .github/scripts/notarize.test.cjs

      - name: Check the changelog
        run: |
          node --test .github/scripts/changelog.test.cjs
          node .github/scripts/changelog.cjs check

      # Check signing continuity without exposing Developer ID credentials to pull requests.
      # Glint.app is signed with a throwaway certificate, then rebuilt with another build
      # number; the rebuild must have a new cdhash yet satisfy the first build's designated
      # requirement (and ad-hoc copies of the same builds must not).
      - name: Create a throwaway signing certificate
        run: |
          Scripts/make_signing_cert.sh --out "$RUNNER_TEMP/glint-signing-cert" \
            --requirement-file "$RUNNER_TEMP/glint-signing-cert/designated-requirement.txt"

      - name: Import the throwaway signing identity
        id: signing
        run: |
          cert_dir="$RUNNER_TEMP/glint-signing-cert"
          GLINT_SIGNING_P12_PASSWORD="$(cat "$cert_dir/glint-signing.p12.password")" \
            Scripts/import_signing_identity.sh --p12 "$cert_dir/glint-signing.p12" > /dev/null

      - name: Assemble Glint.app
        env:
          SWIFTW_BUILD_SYSTEM: native
          GLINT_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          GLINT_REQUIRE_STABLE_SIGNATURE: '1'
          GLINT_REQUIREMENT_FILE: ${{ runner.temp }}/glint-signing-cert/designated-requirement.txt
        run: make app

      - name: Check that updates keep Screen Recording permission
        env:
          SWIFTW_BUILD_SYSTEM: native
          GLINT_SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          GLINT_REQUIREMENT_FILE: ${{ runner.temp }}/glint-signing-cert/designated-requirement.txt
        run: Scripts/check_signing_continuity.sh --previous dist/Glint.app

      - name: Remove the throwaway signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: Scripts/import_signing_identity.sh --cleanup "$KEYCHAIN"
