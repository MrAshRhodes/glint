name: Feature request
description: Suggest an improvement to Glint.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first and describe the problem you want
        to solve, not only a proposed control or implementation.
        Do not include private information. Report security vulnerabilities at
        https://github.com/MrAshRhodes/glint/security/advisories/new instead.

  - type: textarea
    id: workflow
    attributes:
      label: Current workflow
      description: What are you trying to do, and where does Glint fall short?
    validations:
      required: true

  - type: textarea
    id: desired
    attributes:
      label: Desired behaviour
      description: Describe the result you would like and who it would help.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Describe any workarounds you have tried.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: |
        Optional. Include relevant Glint and macOS versions, settings or examples.
        Remove sensitive information from any screenshots or recordings.
